<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>WMS - Finished Goods Inbound</title>
    <style>
        /* [Gunakan CSS Premium Anda dari versi sebelumnya di sini] */
        /* Saya menambahkan CSS khusus untuk Dashboard dan Table */
        :root {
            --bg-color: #f3f6f9; --surface: #ffffff; --primary: #2563eb; 
            --primary-hover: #1d4ed8; --secondary: #10b981; --dark: #0f172a;
            --text-main: #1e293b; --text-muted: #64748b; --border: #e2e8f0;
            --input-bg: #f8fafc; --danger-bg: #fef2f2; --danger-text: #b91c1c;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding-bottom: 100px;}
        
        .app-header { background: rgba(255,255,255, 0.9); backdrop-filter: blur(10px); padding: 15px 20px; box-shadow: 0 1px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 50; display: flex; justify-content: space-between; align-items: center; }
        
        .content { display: none; padding: 20px; animation: fadeIn 0.3s; max-width: 800px; margin: 0 auto; }
        .content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* DASHBOARD CARDS */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .kpi-card { background: var(--surface); padding: 20px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.02); text-align: center; }
        .kpi-value { font-size: 32px; font-weight: 900; color: var(--primary); margin: 10px 0 5px 0; }
        .kpi-label { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        /* TABLE STYLES */
        .table-container { background: var(--surface); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 15px; border-bottom: 1px solid var(--border); font-size: 13px; }
        th { background: var(--input-bg); font-weight: 800; color: var(--text-muted); text-transform: uppercase; font-size: 11px; }
        tr:last-child td { border-bottom: none; }
        
        /* FORM & BUTTONS */
        .form-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .form-input, .form-select { flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--input-bg); outline: none; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px;}
        .btn-export { background: var(--secondary); color: white; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }

        /* BOTTOM NAV */
        .tab-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: white; display: flex; padding: 10px; border-radius: 50px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid var(--border); width: 90%; max-width: 400px; justify-content: space-around; z-index: 100;}
        .tab-btn { padding: 10px 15px; font-size: 12px; font-weight: bold; color: var(--text-muted); cursor: pointer; border-radius: 30px; }
        .tab-btn.active { background: var(--input-bg); color: var(--primary); }

        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); display: flex; align-items: center; justify-content: center; z-index: 999; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen">
        <div style="background: white; padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
            <h2>FG WMS System</h2>
            <p style="color: gray; margin-bottom: 30px;">Authorized Access Only</p>
            <button id="btnLogin" style="background: #4285F4; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer;">Login with Google</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="mainApp" style="display: none;">
        <div class="app-header">
            <b style="color: var(--primary);">📦 FG WMS</b>
            <button id="btnLogout" style="background: transparent; border: 1px solid red; color: red; padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer;">Logout</button>
        </div>

        <!-- TAB 1: DASHBOARD ANALITIK -->
        <div id="tabDashboard" class="content active">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="margin: 0;">Dashboard Analytics</h3>
                <button class="btn-export" onclick="exportToCSV()">⬇️ Export CSV</button>
            </div>
            
            <div class="kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-label">Total Cartons In</div>
                    <div class="kpi-value" id="kpiCartons">0</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Total Inner Boxes</div>
                    <div class="kpi-value" id="kpiInnerBox">0</div>
                </div>
            </div>

            <h4 style="margin-bottom: 10px; color: var(--text-muted);">Summary per SO & Size</h4>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Sales Order</th>
                            <th>Size</th>
                            <th style="text-align: center;">Cartons</th>
                            <th style="text-align: right;">Inner Box</th>
                        </tr>
                    </thead>
                    <tbody id="tableSummaryBody">
                        <tr><td colspan="4" style="text-align: center;">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TAB 2: INPUT INBOUND -->
        <div id="tabInput" class="content">
            <h3>📥 Inbound Input</h3>
            <div style="background: white; padding: 20px; border-radius: 16px; border: 1px solid var(--border);">
                <div class="form-row">
                    <input type="date" id="tglInput" class="form-input">
                    <input type="text" id="soInput" class="form-input" placeholder="SO Number">
                </div>
                <div class="form-row">
                    <select id="tipeInput" class="form-select">
                        <option value="SOLID">SOLID</option>
                        <option value="MIX">MIX</option>
                    </select>
                    <input type="text" id="lokasiInput" class="form-input" placeholder="Location">
                </div>

                <div style="margin: 20px 0; padding-top: 15px; border-top: 1px dashed var(--border);">
                    <h5 style="margin: 0 0 10px 0; color: var(--text-muted);">Carton Details</h5>
                    <div id="kartonList">
                        <div class="form-row karton-item">
                            <input type="text" class="form-input size-input" placeholder="Size" style="flex: 1;">
                            <input type="number" class="form-input ctn-input" placeholder="Ctn No" style="flex: 1;">
                            <input type="number" class="form-input isi-input" placeholder="Inner Qty" value="12" style="flex: 1;">
                            <button class="btn-hapus" style="background:var(--danger-bg); border:none; border-radius:8px; cursor:pointer;" onclick="this.parentElement.remove()">❌</button>
                        </div>
                    </div>
                    <button style="width:100%; padding:10px; background:var(--input-bg); border:1px solid var(--border); border-radius:8px; cursor:pointer;" onclick="tambahBaris()">+ Add Row</button>
                </div>

                <button class="btn-main" id="btnSimpan">Simpan Data Inbound</button>
            </div>
        </div>

        <!-- TAB MENU -->
        <div class="tab-bar">
            <div class="tab-btn active" onclick="switchTab('tabDashboard', this)">📊 Dashboard</div>
            <div class="tab-btn" onclick="switchTab('tabInput', this)">📥 Input</div>
        </div>
    </div>

    <!-- FIREBASE & LOGIC SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // GANTI DENGAN CONFIG FIREBASE ANDA
        const firebaseConfig = { apiKey: "YOUR_API_KEY", authDomain: "YOUR_PROJECT.firebaseapp.com" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // GANTI DENGAN URL GAS SPREADSHEET REKAP (Backend baru kita)
        const URL_REKAP_GAS = "https://script.google.com/macros/s/AKfycbw.../exec";
        
        let globalDataRekap = [];

        // Auth Logic
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                loadDashboardData(); // Load data saat masuk
            } else {
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
            }
        });
        document.getElementById('btnLogin').addEventListener('click', () => signInWithPopup(auth, provider));
        document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));

        // Tab Switcher
        window.switchTab = function(tabId, btn) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            
            if(tabId === 'tabDashboard') loadDashboardData();
        }

        // Add Row Dynamic Input
        window.tambahBaris = function() {
            const list = document.getElementById('kartonList');
            const row = document.createElement('div');
            row.className = 'form-row karton-item';
            row.innerHTML = `
                <input type="text" class="form-input size-input" placeholder="Size" style="flex: 1;">
                <input type="number" class="form-input ctn-input" placeholder="Ctn No" style="flex: 1;">
                <input type="number" class="form-input isi-input" placeholder="Inner Qty" value="12" style="flex: 1;">
                <button style="background:var(--danger-bg); border:none; border-radius:8px; cursor:pointer;" onclick="this.parentElement.remove()">❌</button>
            `;
            list.appendChild(row);
        }

        // Simpan Data Inbound ke GAS
        document.getElementById('btnSimpan').addEventListener('click', async () => {
            const btn = document.getElementById('btnSimpan');
            btn.innerText = "⏳ Menyimpan..."; btn.disabled = true;

            const tanggal = document.getElementById('tglInput').value;
            const so = document.getElementById('soInput').value;
            const type = document.getElementById('tipeInput').value;
            const userName = auth.currentUser.displayName || auth.currentUser.email;

            let payloadData = [];
            document.querySelectorAll('.karton-item').forEach(row => {
                let size = row.querySelector('.size-input').value;
                let ctn = row.querySelector('.ctn-input').value;
                let isi = row.querySelector('.isi-input').value;
                if(size && ctn && isi) {
                    payloadData.push({ tanggal, so, type, user: userName, size, ctn, isi_karton: isi, note: "" });
                }
            });

            if(payloadData.length === 0) {
                alert("Lengkapi detail karton!"); btn.innerText = "Simpan Data Inbound"; btn.disabled = false; return;
            }

            try {
                let res = await fetch(URL_REKAP_GAS, {
                    method: 'POST', mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'insertRekap', data: payloadData })
                });
                alert("✅ Sukses disimpan ke Spreadsheet Rekap!");
                document.getElementById('kartonList').innerHTML = ''; window.tambahBaris(); // reset
            } catch (err) {
                alert("Error: " + err);
            }
            btn.innerText = "Simpan Data Inbound"; btn.disabled = false;
        });

        // Load Data Dashboard via GET dari GAS
        async function loadDashboardData() {
            try {
                let res = await fetch(URL_REKAP_GAS);
                let data = await res.json();
                globalDataRekap = data;

                if(!data || data.length === 0) return;

                // Kalkulasi KPI
                let totalCtn = data.length;
                let totalInner = data.reduce((sum, item) => sum + (Number(item.isi_karton) || 0), 0);
                
                document.getElementById('kpiCartons').innerText = totalCtn;
                document.getElementById('kpiInnerBox').innerText = totalInner.toLocaleString();

                // Pivot Table (Group by SO dan Size)
                let pivot = {};
                data.forEach(d => {
                    let key = d.so + "||" + d.size;
                    if(!pivot[key]) pivot[key] = { so: d.so, size: d.size, ctn: 0, inner: 0 };
                    pivot[key].ctn += 1;
                    pivot[key].inner += (Number(d.isi_karton) || 0);
                });

                let tbody = document.getElementById('tableSummaryBody');
                tbody.innerHTML = '';
                Object.values(pivot).forEach(row => {
                    tbody.innerHTML += `
                        <tr>
                            <td><b>${row.so}</b></td>
                            <td>${row.size}</td>
                            <td style="text-align: center;">${row.ctn}</td>
                            <td style="text-align: right; font-weight:bold; color:var(--primary);">${row.inner.toLocaleString()}</td>
                        </tr>
                    `;
                });

            } catch(e) {
                console.log("Error loading dashboard", e);
            }
        }

        // Export to CSV
        window.exportToCSV = function() {
            if(globalDataRekap.length === 0) return alert("Belum ada data.");
            let csvContent = "data:text/csv;charset=utf-8,Tanggal,SO,Karton,Size,Type,Inner Box,User\n";
            globalDataRekap.forEach(d => {
                csvContent += `${d.tanggal},${d.so},${d.karton},${d.size},${d.type},${d.isi_karton},${d.user}\n`;
            });
            var encodedUri = encodeURI(csvContent);
            var link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Laporan_Inbound_FG.csv");
            document.body.appendChild(link);
            link.click();
        }
    </script>
</body>
</html>
